<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-size="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中级会计职称 · 备考手册</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E中%3C/text%3E%3C/svg%3E">
<meta name="description" content="中级会计职称三科备考学习手册，支持章节浏览、全文目录、搜索与上一页/下一页。">
<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --text: #1f2430;
    --text-soft: #48505f;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eef4ff;
    --border: #e5e7eb;
    --code-bg: #f6f8fa;
    --inline-code: #eef1f6;
    --table-head: #f8fafc;
    --mark: #fff3bf;
    --toolbar-bg: rgba(255, 255, 255, 0.86);
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 10px 30px rgba(16, 24, 40, 0.06);
    --radius: 16px;
  }
  html[data-theme="dark"] {
    --bg: #0f131a;
    --panel: #161c26;
    --text: #e6eaf2;
    --text-soft: #c3cad6;
    --muted: #94a3b8;
    --accent: #6aa6ff;
    --accent-soft: #1b2740;
    --border: #263041;
    --code-bg: #111823;
    --inline-code: #1e2836;
    --table-head: #1a2230;
    --mark: #4a3b00;
    --toolbar-bg: rgba(15, 19, 26, 0.86);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.75;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; cursor: pointer; }

  /* ============ 侧边栏 ============ */
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 300px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--border);
    z-index: 40;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 20px 14px;
  }
  .brand-badge {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .brand-text strong {
    display: block;
    font-size: 16px;
    line-height: 1.35;
  }
  .brand-text span {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .search-box {
    position: relative;
    margin: 4px 16px 12px;
  }
  .search-box input {
    width: 100%;
    padding: 9px 34px 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .search-box .clear {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    padding: 2px 6px;
    border-radius: 6px;
    display: none;
  }
  .search-box .clear:hover { background: var(--border); color: var(--text); }
  .search-box.has-value .clear { display: block; }

  .nav {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px 16px;
    overscroll-behavior: contain;
  }
  .nav::-webkit-scrollbar { width: 8px; }
  .nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .nav::-webkit-scrollbar-track { background: transparent; }

  .nav-group { margin-bottom: 14px; }
  .nav-group-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px 6px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .nav-group-title em {
    font-style: normal;
    font-weight: 500;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.75;
  }
  .nav-item {
    position: relative;
    display: block;
    padding: 7px 12px 7px 14px;
    margin: 1px 0;
    border-radius: 8px;
    color: var(--text-soft);
    font-size: 13.5px;
    line-height: 1.5;
    transition: background 0.12s, color 0.12s;
  }
  .nav-item:hover {
    background: var(--bg);
    color: var(--text);
    text-decoration: none;
  }
  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .nav-item.active::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 9px;
    bottom: 9px;
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
  }
  .nav-empty {
    padding: 24px 12px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .sidebar-foot {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.6;
  }

  /* ============ 主区域 ============ */
  .main {
    margin-left: 300px;
    min-height: 100vh;
  }
  .progress {
    position: fixed;
    top: 0;
    left: 300px;
    right: 0;
    height: 2px;
    z-index: 60;
    background: transparent;
    pointer-events: none;
  }
  .progress i {
    display: block;
    width: 0;
    height: 100%;
    background: var(--accent);
    transition: width 0.08s linear;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 58px;
    padding: 0 28px;
    background: var(--toolbar-bg);
    backdrop-filter: saturate(160%) blur(12px);
    -webkit-backdrop-filter: saturate(160%) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .menu-btn { display: none; }
  .icon-btn.menu-btn { display: none; }
  .crumb {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .crumb b {
    font-weight: 600;
    color: var(--text);
  }
  .crumb .sep { margin: 0 7px; opacity: 0.6; }
  .toolbar-actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    display: inline-grid;
    place-items: center;
    min-width: 32px;
    height: 32px;
    padding: 0 8px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .icon-btn:hover {
    background: var(--bg);
    border-color: var(--border);
    color: var(--text);
  }
  .divider {
    width: 1px;
    height: 18px;
    background: var(--border);
    margin: 0 4px;
  }

  .content {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 212px;
    gap: 40px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 32px 36px 96px;
  }
  body.no-toc .content { grid-template-columns: minmax(0, 1fr); max-width: 980px; }
  body.no-toc .toc { display: none; }

  article {
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 46px 52px 52px;
    font-size: 16px;
    color: var(--text-soft);
  }
  html[data-size="s"] article { font-size: 15px; }
  html[data-size="l"] article { font-size: 17.5px; }
  html[data-size="xl"] article { font-size: 19px; }

  article > :first-child { margin-top: 0 !important; }
  article h1 {
    font-size: 2em;
    line-height: 1.35;
    color: var(--text);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  article h1 + p { color: var(--muted); }
  article h2 {
    font-size: 1.5em;
    line-height: 1.45;
    color: var(--text);
    margin: 2.2em 0 0.8em;
    padding-bottom: 0.35em;
    border-bottom: 1px solid var(--border);
    scroll-margin-top: 80px;
  }
  article h2::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 0.86em;
    margin-right: 0.45em;
    border-radius: 2px;
    background: var(--accent);
    vertical-align: -0.06em;
  }
  article h3 {
    font-size: 1.18em;
    color: var(--text);
    margin: 1.8em 0 0.6em;
    scroll-margin-top: 80px;
  }
  article h4 { color: var(--text); margin: 1.4em 0 0.5em; }
  article p { margin: 0.8em 0; }
  article strong { color: var(--text); font-weight: 650; }
  article ul, article ol { padding-left: 1.5em; margin: 0.7em 0; }
  article li { margin: 0.3em 0; }
  article li > p { margin: 0.25em 0; }
  article hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 2.4em 0;
  }
  article blockquote {
    margin: 1.2em 0;
    padding: 0.7em 1.1em;
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    background: var(--accent-soft);
    color: var(--text-soft);
  }
  article blockquote > :first-child { margin-top: 0; }
  article blockquote > :last-child { margin-bottom: 0; }

  article code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.87em;
    padding: 0.18em 0.4em;
    border-radius: 5px;
    background: var(--inline-code);
    color: var(--text);
    word-break: break-word;
  }
  article pre {
    position: relative;
    margin: 1.15em 0;
    padding: 16px 18px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
    line-height: 1.65;
  }
  article pre code {
    display: block;
    padding: 0;
    background: transparent;
    border-radius: 0;
    font-size: 13.5px;
    color: var(--text);
    white-space: pre;
  }
  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    padding: 3px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.6;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  .copy-btn.done { color: #16a34a; border-color: #16a34a; opacity: 1; }

  .table-wrap {
    margin: 1.15em 0;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  article table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92em;
    line-height: 1.6;
  }
  article th, article td {
    padding: 9px 13px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }
  article th {
    background: var(--table-head);
    color: var(--text);
    font-weight: 650;
    white-space: nowrap;
  }
  article tr:last-child td { border-bottom: 0; }
  article tbody tr:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }

  article details {
    margin: 1.1em 0;
    padding: 0.75em 1em;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--code-bg);
  }
  article summary {
    cursor: pointer;
    color: var(--text);
    font-weight: 600;
    list-style: none;
    position: relative;
    padding-left: 18px;
  }
  article summary::-webkit-details-marker { display: none; }
  article summary::before {
    content: "▸";
    position: absolute;
    left: 0;
    top: 0;
    color: var(--accent);
    transition: transform 0.15s;
  }
  article details[open] summary::before { transform: rotate(90deg); }
  article details[open] summary { margin-bottom: 0.6em; }
  article img { max-width: 100%; height: auto; border-radius: 8px; }
  article mark { background: var(--mark); color: inherit; padding: 0 2px; }

  .pager {
    display: flex;
    gap: 14px;
    margin-top: 28px;
  }
  .pager-btn {
    flex: 1;
    min-width: 0;
    text-align: left;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    color: var(--muted);
    font-size: 12px;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .pager-btn:hover:not(:disabled) {
    border-color: var(--accent);
    box-shadow: var(--shadow);
    transform: translateY(-1px);
  }
  .pager-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .pager-btn.next { text-align: right; }
  .pager-btn span {
    display: block;
    margin-top: 3px;
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ============ 右侧页内目录 ============ */
  .toc {
    position: sticky;
    top: 90px;
    align-self: start;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    padding: 4px 0 16px;
    font-size: 12.5px;
  }
  .toc-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 0 0 8px 12px;
    text-transform: uppercase;
  }
  .toc-link {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 4px 10px 4px 12px;
    border-left: 2px solid transparent;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.55;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.12s, border-color 0.12s;
  }
  .toc-link:hover { color: var(--text); }
  .toc-link.h3 { padding-left: 24px; font-size: 12px; }
  .toc-link.active {
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 600;
  }

  .back-top {
    position: fixed;
    right: 26px;
    bottom: 26px;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--panel);
    color: var(--muted);
    box-shadow: var(--shadow);
    font-size: 16px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    z-index: 30;
  }
  .back-top.show { opacity: 1; visibility: visible; transform: none; }
  .back-top:hover { color: var(--accent); border-color: var(--accent); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s, visibility 0.2s;
    z-index: 35;
  }

  .loading, .error-card { color: var(--muted); }
  .loading { padding: 80px 0; text-align: center; font-size: 14px; }
  .error-card {
    padding: 10px 0;
    color: var(--text-soft);
    font-size: 15px;
  }
  .error-card h2 {
    margin-top: 0;
    border-bottom: 0;
    padding-bottom: 0;
  }
  .error-card h2::before { display: none; }
  .error-card pre code { font-size: 13px; }
  .error-path {
    font-family: Consolas, monospace;
    font-size: 12.5px;
    color: var(--muted);
    background: var(--code-bg);
    padding: 6px 10px;
    border-radius: 6px;
    word-break: break-all;
  }

  /* ============ 响应式 ============ */
  @media (max-width: 1280px) {
    .content { grid-template-columns: minmax(0, 1fr); max-width: 980px; }
    .toc { display: none; }
    body.no-toc .content { max-width: 980px; }
  }
  @media (max-width: 960px) {
    .sidebar { transform: translateX(-100%); transition: transform 0.24s ease; box-shadow: none; }
    body.drawer-open .sidebar { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, 0.2); }
    body.drawer-open .overlay { opacity: 1; visibility: visible; }
    .main { margin-left: 0; }
    .progress { left: 0; }
    .icon-btn.menu-btn { display: inline-grid; }
    .toolbar { padding: 0 16px; }
    .content { padding: 20px 18px 80px; }
    article { padding: 30px 24px 36px; border-radius: 12px; }
    .brand { padding-top: 16px; }
  }
  @media (max-width: 560px) {
    article { padding: 24px 18px 30px; font-size: 15.5px; }
    article h1 { font-size: 1.6em; }
    article h2 { font-size: 1.3em; }
    .pager { flex-direction: column; }
    .pager-btn.next { text-align: left; }
    .toolbar-actions .divider { display: none; }
    .back-top { right: 16px; bottom: 16px; }
  }

  @media print {
    .sidebar, .toolbar, .toc, .progress, .pager, .back-top, .overlay, .copy-btn { display: none !important; }
    .main { margin: 0; }
    .content { display: block; padding: 0; max-width: none; }
    article { border: 0; box-shadow: none; padding: 0; }
    body { background: #fff; }
  }
</style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-badge">中级</div>
      <div class="brand-text">
        <strong>中级会计职称</strong>
        <span>2027 考季 · 三科备考手册</span>
      </div>
    </div>
    <div class="search-box" id="searchBox">
      <input id="search" type="search" placeholder="搜索章节 / 关键词" autocomplete="off" aria-label="搜索章节">
      <button class="clear" id="searchClear" title="清空" aria-label="清空搜索">×</button>
    </div>
    <nav class="nav" id="nav" aria-label="文档目录"></nav>
    <div class="nav-empty" id="navEmpty" hidden>没有匹配的章节</div>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <div class="main">
    <div class="progress"><i id="progressBar"></i></div>
    <div class="toolbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开目录">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="toolbar-actions">
        <button class="icon-btn" id="fontMinus" title="缩小字号" aria-label="缩小字号">A−</button>
        <button class="icon-btn" id="fontPlus" title="放大字号" aria-label="放大字号">A+</button>
        <span class="divider"></span>
        <button class="icon-btn" id="themeBtn" title="切换深色 / 浅色" aria-label="切换主题">◐</button>
      </div>
    </div>

    <div class="content" id="contentWrap">
      <div>
        <article id="content" aria-live="polite">
          <p class="loading">正在加载…</p>
        </article>
        <div class="pager">
          <button class="pager-btn prev" id="prevBtn" disabled>← 上一篇<span></span></button>
          <button class="pager-btn next" id="nextBtn" disabled>下一篇 →<span></span></button>
        </div>
      </div>
      <aside class="toc" id="toc" aria-label="页内导航"></aside>
    </div>
  </div>

  <button class="back-top" id="backTop" title="回到顶部" aria-label="回到顶部">↑</button>

  <script src="marked.min.js"></script>
  <script>
  (function () {
    "use strict";

    /* ---------------- 目录清单 ---------------- */
    var MANIFEST = [
      { group: "开始", items: [
        { title: "README · 项目总览", path: "README.md" }
      ]},
      { group: "学习路径", items: [
        { title: "00 考试全景与报名指南", path: "学习路径/00-考试全景与报名指南.md" },
        { title: "01 备考计划（6 个月 / 90 天）", path: "学习路径/01-备考计划-长线6个月90天.md" },
        { title: "02 学习方法与记忆体系", path: "学习路径/02-学习方法与记忆体系.md" },

    /* ---------------- 元素与状态 ---------------- */
    var contentEl = document.getElementById("content");
    var navEl = document.getElementById("nav");
    var navEmpty = document.getElementById("navEmpty");
    var crumbEl = document.getElementById("crumb");
    var tocEl = document.getElementById("toc");
    var prevBtn = document.getElementById("prevBtn");
    var nextBtn = document.getElementById("nextBtn");
    var progressBar = document.getElementById("progressBar");
    var backTop = document.getElementById("backTop");
    var searchInput = document.getElementById("search");
    var searchBox = document.getElementById("searchBox");
    var searchClear = document.getElementById("searchClear");
    var sidebar = document.getElementById("sidebar");
    var overlay = document.getElementById("overlay");

    var FLAT = [];
    var INDEX = Object.create(null);
    MANIFEST.forEach(function (group) {
      group.items.forEach(function (item) {
        item.group = group.group;
        item.index = FLAT.length;
        FLAT.push(item);
        INDEX[item.path] = item;
      });
    });

    var currentPath = "";
    var pendingAnchor = null;
    var headings = [];
    var ticking = false;

    /* ---------------- 工具 ---------------- */
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function safeDecode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }

    function resolvePath(base, rel) {
      var parts = base.split("/").slice(0, -1);
      rel.split("/").forEach(function (seg) {
        if (seg === "..") parts.pop();
        else if (seg !== "." && seg !== "") parts.push(seg);
      });
      return parts.join("/");
    }

    function closeDrawer() {
      document.body.classList.remove("drawer-open");
    }

    /* ---------------- 侧边栏 ---------------- */
    function buildNav() {
      MANIFEST.forEach(function (group) {
        var sec = document.createElement("section");
        sec.className = "nav-group";

        var title = document.createElement("div");
        title.className = "nav-group-title";
        title.innerHTML = "<span></span><em></em>";
        title.firstChild.textContent = group.group;
        title.lastChild.textContent = group.items.length + " 篇";
        sec.appendChild(title);

        group.items.forEach(function (item) {
          var a = document.createElement("a");
          a.className = "nav-item";
          a.href = "#" + encodeURIComponent(item.path);
          a.dataset.path = item.path;
          a.textContent = item.title;
          a.addEventListener("click", function (e) {
            e.preventDefault();
            closeDrawer();
            go(item.path);
          });
          sec.appendChild(a);
        });

        navEl.appendChild(sec);
      });

      document.getElementById("sidebarFoot").textContent =
        "共 " + FLAT.length + " 篇 · 支持离线阅读";
    }

    function setActive(path) {
      var links = navEl.querySelectorAll(".nav-item");
      for (var i = 0; i < links.length; i++) {
        var active = links[i].dataset.path === path;
        links[i].classList.toggle("active", active);
        if (active) {
          links[i].scrollIntoView({ block: "nearest" });
        }
      }
      var item = INDEX[path];
      if (item) {
        crumbEl.innerHTML =
          '<span class="group-name"></span><span class="sep">/</span><b></b>';
        crumbEl.querySelector(".group-name").textContent = item.group;
        crumbEl.querySelector("b").textContent = item.title;
      }
    }

    function filterNav(query) {
      var q = query.trim().toLowerCase();
      var total = 0;
      var groups = navEl.querySelectorAll(".nav-group");
      groups.forEach(function (sec) {
        var visible = 0;
        sec.querySelectorAll(".nav-item").forEach(function (a) {
          var item = INDEX[a.dataset.path];
          var hay = (item.title + " " + item.path + " " + item.group).toLowerCase();
          var show = !q || hay.indexOf(q) !== -1;
          a.style.display = show ? "" : "none";
          if (show) visible++;
        });
        sec.style.display = visible ? "" : "none";
        total += visible;
      });
      navEmpty.hidden = total > 0;
      searchBox.classList.toggle("has-value", !!q);
    }

    /* ---------------- 正文加载与渲染 ---------------- */
    function render(path) {
      var item = INDEX[path];
      if (!item) {
        showNotFound(path);
        return;
      }
      currentPath = path;
      setActive(path);
      document.title = item.title + " · 中级会计职称备考手册";

      contentEl.innerHTML = '<p class="loading">正在加载…</p>';
      tocEl.innerHTML = "";
      headings = [];

      fetch(encodeURI(path), { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(function (md) {
          if (!window.marked) throw new Error("marked 解析库未加载");
          contentEl.innerHTML = marked.parse(md);
          enhance();
          buildToc();
          updatePager(path);
          window.scrollTo({ top: 0, behavior: "auto" });
          updateScrollUi();
          if (pendingAnchor) {
            scrollToAnchor(pendingAnchor);
            pendingAnchor = null;
          }
        })
        .catch(function (err) {
          showLoadError(path, err);
        });
    }

    function enhance() {
      contentEl.querySelectorAll("table").forEach(function (table) {
        if (table.parentElement.classList.contains("table-wrap")) return;
        var wrap = document.createElement("div");
        wrap.className = "table-wrap";
        table.parentNode.insertBefore(wrap, table);
        wrap.appendChild(table);
      });

      contentEl.querySelectorAll("pre").forEach(function (pre) {
        var code = pre.querySelector("code");
        if (!code) return;
        var btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.type = "button";
        btn.textContent = "复制";
        btn.addEventListener("click", function () {
          var text = code.innerText;
          var done = function () {
            btn.textContent = "已复制";
            btn.classList.add("done");
            setTimeout(function () {
              btn.textContent = "复制";
              btn.classList.remove("done");
            }, 1500);
          };
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(done).catch(fallback);
          } else {
            fallback();
          }
          function fallback() {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ }
            document.body.removeChild(ta);
          }
        });
        pre.appendChild(btn);
      });

      contentEl.querySelectorAll("a[href]").forEach(function (a) {
        var href = a.getAttribute("href");
        if (!href) return;
        if (/^(https?:|mailto:|tel:)/i.test(href)) {
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          return;
        }
        if (href.charAt(0) === "#") {
          a.addEventListener("click", function (e) {
            e.preventDefault();
            scrollToAnchor(safeDecode(href.slice(1)));
          });
          return;
        }
        var parts = href.split("#");
        var target = safeDecode(parts[0]);
        if (!/\.md$/i.test(target)) return;
        a.addEventListener("click", function (e) {
          e.preventDefault();
          pendingAnchor = parts[1] ? safeDecode(parts[1]) : null;
          go(resolvePath(currentPath, target));
        });
      });
    }

    /* ---------------- 页内目录 ---------------- */
    function buildToc() {
      tocEl.innerHTML = "";
      headings = Array.prototype.slice.call(contentEl.querySelectorAll("h2, h3"));
      if (headings.length < 3) {
        document.body.classList.add("no-toc");
        return;
      }
      document.body.classList.remove("no-toc");

      var title = document.createElement("div");
      title.className = "toc-title";
      title.textContent = "本页目录";
      tocEl.appendChild(title);

      headings.forEach(function (h, i) {
        if (!h.id) h.id = "sec-" + i;
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "toc-link" + (h.tagName === "H3" ? " h3" : "");
        btn.textContent = h.textContent.replace(/^[一二三四五六七八九十]+、\s*/, "");
        btn.dataset.target = h.id;
        btn.addEventListener("click", function () {
          scrollToAnchor(h.id);
        });
        tocEl.appendChild(btn);
      });
      updateTocActive();
    }

    function scrollToAnchor(id) {
      if (!id) return;
      var el = document.getElementById(id);
      if (!el) return;
      var top = el.getBoundingClientRect().top + window.scrollY - 76;
      window.scrollTo({ top: top, behavior: "smooth" });
    }

    function updateTocActive() {
      if (!headings.length) return;
      var activeId = headings[0].id;
      for (var i = 0; i < headings.length; i++) {
        if (headings[i].getBoundingClientRect().top <= 120) {
          activeId = headings[i].id;
        } else {
          break;
        }
      }
      tocEl.querySelectorAll(".toc-link").forEach(function (b) {
        b.classList.toggle("active", b.dataset.target === activeId);
      });
    }

    /* ---------------- 上一篇 / 下一篇 ---------------- */
    function updatePager(path) {
      var item = INDEX[path];
      var prev = FLAT[item.index - 1];
      var next = FLAT[item.index + 1];

      prevBtn.disabled = !prev;
      nextBtn.disabled = !next;
      prevBtn.querySelector("span").textContent = prev ? prev.title : "已是第一篇";
      nextBtn.querySelector("span").textContent = next ? next.title : "已是最后一篇";

      prevBtn.onclick = prev ? function () { go(prev.path); } : null;
      nextBtn.onclick = next ? function () { go(next.path); } : null;
    }

    /* ---------------- 路由 ---------------- */
    function go(path) {
      closeDrawer();
      if (path === currentPath) {
        if (pendingAnchor) {
          scrollToAnchor(pendingAnchor);
          pendingAnchor = null;
        }
        return;
      }
      window.location.hash = encodeURIComponent(path);
    }

    window.addEventListener("hashchange", function () {
      var raw = window.location.hash.slice(1);
      if (!raw) return;
      var path;
      try { path = decodeURIComponent(raw); } catch (e) { return; }
      if (path !== currentPath) render(path);
    });

    /* ---------------- 错误提示 ---------------- */
    function showNotFound(path) {
      currentPath = path;
      contentEl.innerHTML =
        '<div class="error-card"><h2>没有找到这篇文档</h2>' +
        '<p class="error-path">' + escapeHtml(path) + "</p>" +
        '<p>链接可能已经调整，请从左侧目录重新选择。</p>' +
        '<p><a href="#" id="errHome">返回 README</a></p></div>';
      bindErrHome();
    }

    function showLoadError(path, err) {
      var isFile = window.location.protocol === "file:";
      var html = '<div class="error-card"><h2>无法打开这篇文档</h2>' +
        '<p class="error-path">' + escapeHtml(path) + "</p>";
      if (isFile) {
        html +=
          "<p>浏览器出于安全限制，禁止网页直接读取本地 <code>file://</code> 文件。</p>" +
          "<p>请在 <code>project4</code> 目录下启动一个本地服务器，再访问 <code>http://localhost:8080</code>：</p>" +
          "<pre><code>python -m http.server 8080</code></pre>" +
          "<p>或使用 Node.js：</p>" +
          "<pre><code>npx serve .</code></pre>" +
          "<p>启动后打开浏览器访问对应地址即可。</p>";
      } else {
        html +=
          "<p>请求失败：" + escapeHtml(err && err.message ? err.message : String(err)) + "</p>" +
          "<p>请确认文件存在，并检查本地服务器是否仍在运行，然后刷新重试。</p>";
      }
      html += '<p><a href="#" id="errHome">返回 README</a></p></div>';
      contentEl.innerHTML = html;
      bindErrHome();
    }

    function bindErrHome() {
      var home = document.getElementById("errHome");
      if (home) {
        home.addEventListener("click", function (e) {
          e.preventDefault();
          go("README.md");
        });
      }
    }

    /* ---------------- 滚动 UI ---------------- */
    function updateScrollUi() {
      var docH = document.documentElement.scrollHeight - window.innerHeight;
      var pct = docH > 0 ? Math.min(100, Math.max(0, (window.scrollY / docH) * 100)) : 0;
      progressBar.style.width = pct + "%";
      backTop.classList.toggle("show", window.scrollY > 600);
    }

    window.addEventListener("scroll", function () {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(function () {
          updateScrollUi();
          updateTocActive();
          ticking = false;
        });
      }
    }, { passive: true });

    backTop.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* ---------------- 交互 ---------------- */
    document.getElementById("menuBtn").addEventListener("click", function () {
      document.body.classList.toggle("drawer-open");
    });
    overlay.addEventListener("click", closeDrawer);

    searchInput.addEventListener("input", function () {
      filterNav(searchInput.value);
    });
    searchClear.addEventListener("click", function () {
      searchInput.value = "";
      filterNav("");
      searchInput.focus();
    });
    searchInput.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        searchInput.value = "";
        filterNav("");
        searchInput.blur();
      }
    });

    var SIZES = ["s", "m", "l", "xl"];
    function setSize(size) {
      document.documentElement.dataset.size = size;
      try { localStorage.setItem("zd-size", size); } catch (e) { /* ignore */ }
    }
    document.getElementById("fontMinus").addEventListener("click", function () {
      var i = SIZES.indexOf(document.documentElement.dataset.size || "m");
      setSize(SIZES[Math.max(0, i - 1)]);
    });
    document.getElementById("fontPlus").addEventListener("click", function () {
      var i = SIZES.indexOf(document.documentElement.dataset.size || "m");
      setSize(SIZES[Math.min(SIZES.length - 1, i + 1)]);
    });

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem("zd-theme", theme); } catch (e) { /* ignore */ }
    }
    document.getElementById("themeBtn").addEventListener("click", function () {
      setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });

    try {
      var savedTheme = localStorage.getItem("zd-theme");
      if (savedTheme === "dark" || savedTheme === "light") setTheme(savedTheme);
      var savedSize = localStorage.getItem("zd-size");
      if (SIZES.indexOf(savedSize) !== -1) setSize(savedSize);
    } catch (e) { /* ignore */ }

    /* ---------------- 启动 ---------------- */
    buildNav();
    filterNav("");
    document.getElementById("sidebarFoot").textContent =
      "共 " + FLAT.length + " 篇 · 支持离线阅读";

    if (!window.marked) {
      contentEl.innerHTML =
        '<div class="error-card"><h2>Markdown 解析库加载失败</h2>' +
        "<p>请确认 <code>marked.min.js</code> 与 <code>index.html</code> 位于同一目录。</p>" +
        "<p>文件缺失时，可从 <code>https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js</code> 下载后放入项目根目录。</p></div>";
      return;
    }
    marked.setOptions({ gfm: true, breaks: false });

    var initial = "README.md";
    var rawHash = window.location.hash.slice(1);
    if (rawHash) {
      try {
        var decoded = decodeURIComponent(rawHash);
        if (INDEX[decoded]) initial = decoded;
      } catch (e) { /* ignore */ }
    }
    render(initial);
